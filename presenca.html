  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

<style>
  /* Duas telas: registro no celular (coluna estreita) e telão do sorteio (projetor, 2 colunas). Papel creme, tema único. */
  :root {
    --creme: #EFEFE3;
    --creme-claro: #F8F7EE;
    --papel: #FFFEF7;
    --folha: #3E7B3F;
    --folha-escura: #24472B;
    --broto: #8DB866;
    --broto-claro: #DDEAC8;
    --sol: #E9C152;
    --sol-claro: #FBF0C9;
    --casca: #5B4630;
    --tinta: #22321F;
    --tinta-suave: #5A6853;
    --linha: rgba(36, 71, 43, 0.16);
    --serif: "Young Serif", Georgia, "Times New Roman", serif;
    --sans: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  * , *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--creme); color: var(--tinta); font-family: var(--sans); font-size: 16px; line-height: 1.55; min-height: 100vh; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--sol); outline-offset: 3px; border-radius: 10px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 400; color: var(--folha-escura); text-wrap: balance; margin: 0; }

  .faixa-teste { background: var(--sol-claro); color: var(--casca); border-bottom: 1px solid rgba(91,70,48,.2); padding: 10px 20px; font-size: 0.9rem; text-align: center; }

  .botao { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 1rem; background: var(--folha); color: var(--papel); transition: background .2s, transform .1s; }
  .botao:hover { background: var(--folha-escura); }
  .botao:active { transform: scale(.98); }
  .botao[disabled] { opacity: .55; cursor: default; }
  .botao.leve { background: transparent; color: var(--folha); border: 1.5px solid var(--folha); padding: 10.5px 20px; }
  .botao.leve:hover { background: var(--broto-claro); }
  .botao.largo { width: 100%; }
  .link { background: none; border: 0; padding: 0; color: var(--folha); font-weight: 600; text-decoration: underline; }

  .campo { display: grid; gap: 6px; }
  .campo label { font-weight: 600; font-size: 0.95rem; }
  .campo input, .campo select { font: inherit; font-size: 1.05rem; padding: 13px 16px; border-radius: 16px; border: 1.5px solid var(--linha); background: var(--papel); color: var(--tinta); width: 100%; }
  .campo input:focus, .campo select:focus { outline: none; border-color: var(--folha); box-shadow: 0 0 0 3px var(--broto-claro); }
  .aviso { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--sol-claro); color: var(--casca); font-size: 0.95rem; }
  .aviso.erro { background: #F6E3D6; color: #7A3E1D; }
  .nota { font-size: 0.88rem; color: var(--tinta-suave); margin: 0; }
  .carregando { display: flex; align-items: center; gap: 12px; color: var(--tinta-suave); padding: 24px 0; }
  .broto-girando { width: 16px; height: 16px; border-radius: 0 100% 0 100%; background: var(--broto); animation: girar 1s linear infinite; flex: none; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ---------- Registro (celular) ---------- */
  .registro { max-width: 460px; margin: 0 auto; padding: 28px 18px 40px; display: grid; gap: 20px; }
  .registro .topo { display: flex; gap: 14px; align-items: center; }
  .registro .topo img { width: 72px; height: auto; flex: none; }
  .selo { margin: 0; font-size: 0.85rem; font-weight: 600; color: var(--casca); }
  .registro h1 { font-size: 1.9rem; line-height: 1.1; }
  .cartao { background: var(--creme-claro); border: 1px solid var(--linha); border-radius: 24px; padding: 22px; display: grid; gap: 16px; }
  .evento-nome { font-family: var(--serif); font-size: 1.15rem; color: var(--tinta); margin: 0; }
  .eventos { display: grid; gap: 10px; }
  .eventos .botao { text-align: left; border-radius: 16px; }
  .sucesso { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 10px 0; }
  .selo-ok { width: 76px; height: 76px; border-radius: 50%; background: var(--folha); box-shadow: 0 0 0 8px var(--broto-claro); display: grid; place-items: center; animation: brotar .6s cubic-bezier(.2,.9,.3,1.3) both; }
  .selo-ok span { color: var(--papel); font-size: 2.1rem; font-weight: 700; line-height: 1; }
  .sucesso h2 { font-size: 1.6rem; }
  .sucesso .hora { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--folha); }
  @keyframes brotar { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- Telão do sorteio ---------- */
  .telao { max-width: 1280px; margin: 0 auto; padding: 24px 20px 40px; display: grid; gap: 20px; }
  .telao .cabeca { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
  .telao .cabeca h1 { font-size: clamp(1.6rem, 3.4vw, 2.6rem); line-height: 1.1; }
  .telao .controles { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .telao .controles .campo { min-width: 260px; }
  .palco-grade { display: grid; gap: 20px; }
  @media (min-width: 980px) { .palco-grade { grid-template-columns: 340px 1fr; align-items: start; } }

  .lateral { display: grid; gap: 16px; }
  .qr { background: var(--papel); border: 1px solid var(--linha); border-radius: 22px; padding: 18px; display: grid; gap: 10px; justify-items: center; text-align: center; }
  .qr #qrcode { width: 220px; height: 220px; display: grid; place-items: center; }
  .qr #qrcode svg { width: 220px; height: 220px; display: block; }
  .qr #qrcode svg rect { fill: #FFFEF7; }
  .qr #qrcode svg path { fill: #24472B; }
  .qr .url { font-size: 0.78rem; color: var(--tinta-suave); word-break: break-all; }
  .contador { background: var(--folha); color: var(--papel); border-radius: 22px; padding: 18px 20px; display: flex; align-items: baseline; gap: 12px; }
  .contador b { font-family: var(--serif); font-weight: 400; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .contador span { font-size: 1rem; opacity: .9; }
  .ultimos { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 0.92rem; color: var(--tinta-suave); }
  .ultimos li { padding: 6px 12px; background: var(--creme-claro); border-radius: 10px; animation: entrar .4s ease-out; }
  @keyframes entrar { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  .palco {
    position: relative; overflow: hidden;
    background: var(--creme-claro); border: 1px solid var(--linha); border-radius: 28px;
    min-height: 460px; padding: 28px; display: grid; align-content: center; justify-items: center; gap: 18px; text-align: center;
  }
  .palco .fundo-arvore { position: absolute; inset: auto -40px -60px auto; width: 360px; opacity: .14; pointer-events: none; }
  .palco .rotulo { margin: 0; font-weight: 600; color: var(--casca); font-size: 1.05rem; min-height: 1.6em; }
  .nome-sorteio {
    font-family: var(--serif); color: var(--folha-escura);
    font-size: clamp(2.2rem, 6.2vw, 5.4rem); line-height: 1.05; min-height: 1.1em; margin: 0;
    font-variant-numeric: tabular-nums;
  }
  .nome-sorteio.girando { color: var(--tinta-suave); filter: blur(.4px); }
  .nome-sorteio.vencedor { color: var(--folha); animation: revelar .9s cubic-bezier(.2,.9,.3,1.25) both; }
  @keyframes revelar { 0% { transform: scale(.7); opacity: .2; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  .casa-sorteio { margin: 0; font-size: 1.3rem; color: var(--casca); font-weight: 600; min-height: 1.6em; }
  .barra { width: min(520px, 90%); height: 8px; border-radius: 99px; background: var(--broto-claro); overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: var(--folha); border-radius: 99px; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; font-size: 0.95rem; color: var(--tinta-suave); }
  .opcoes label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .opcoes input { width: 18px; height: 18px; accent-color: var(--folha); }
  .botao.sortear { font-size: 1.25rem; padding: 16px 40px; }

  .baixar { display: grid; gap: 6px; font-size: 0.9rem; }
  .baixar a { color: var(--folha); font-weight: 600; }
  .historico h3 { font-size: 1.2rem; margin-bottom: 8px; }
  .historico ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .historico li { display: flex; gap: 12px; align-items: center; background: var(--papel); border: 1px solid var(--linha); border-radius: 14px; padding: 10px 14px; }
  .historico .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--sol); color: var(--tinta); font-weight: 700; flex: none; }
  .historico .q { margin-left: auto; font-size: 0.85rem; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }

  .chuva { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .folha-caindo { position: absolute; top: -30px; width: 16px; height: 16px; border-radius: 0 100% 0 100%; animation: cair linear forwards; }
  @keyframes cair {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate(var(--deriva), 105vh) rotate(var(--giro)); opacity: .9; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .chuva { display: none; }
  }
</style>

const PICO = /simult|too many|muitos scripts|invoked too many|ocupado|servidor|timed out|tempo limite|failed to fetch|network/i;
const esperar = ms => new Promise(r => setTimeout(r, ms));
function chamarUmaVez(funcao, args) {
  return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ acao: funcao, args: args }) })
    .then(r => r.json())
    .catch(() => { const e = new Error(SEM_CONEXAO); e.repetir = true; throw e; })
    .then(j => { if (!j.ok) { const e = new Error(j.erro || SEM_CONEXAO); e.repetir = PICO.test(e.message); throw e; } return j.dados; });
}
async function chamar(funcao, ...args) {
  const pausas = [1200, 2500, 5000, 9000];
  for (let t = 0; ; t++) {
    try { return await chamarUmaVez(funcao, args); }
    catch (e) { if (!e.repetir || t >= pausas.length) throw e; await esperar(pausas[t] + Math.random() * 1500); }
  }
}

    f.style.animationDelay = (Math.random() * 1.4) + "s";
    f.style.setProperty("--deriva", (Math.random() * 180 - 90) + "px");
    f.style.setProperty("--giro", (Math.random() * 720 - 360) + "deg");
    $("chuva").appendChild(f);
    setTimeout(() => f.remove(), (dur + 1.6) * 1000);
  }
}

let EVENTOS = null;
async function carregarEventos() {
  if (!EVENTOS) EVENTOS = await chamar("eventos");
  return EVENTOS;
}
function linkPresenca(id) {
  return location.origin + location.pathname + "?evento=" + encodeURIComponent(id) + (TESTE ? "&teste" : "");
}

/* =========================================================
   REGISTRO DE PRESENÇA (participante, no celular)
   ========================================================= */
let eventoAtual = null;

async function iniciarRegistro() {
  document.title = "Presença SIPAT 2026";
  app.innerHTML = `<section class="registro">${carregando("Abrindo a lista de presença…")}</section>`;
  try {
    const ev = await carregarEventos();
    const pedido = PARAMS.get("evento");
    eventoAtual = ev.lista.find(e => e.id === pedido) || (!pedido && ev.lista.find(e => e.data === ev.hoje)) || null;
    if (!eventoAtual) return telaEscolherEvento(ev, pedido);
    telaRegistro();
  } catch (e) {
    app.innerHTML = `<section class="registro"><p class="aviso erro" role="alert">${esc(e.message)}</p></section>`;
  }
}

function cabecalhoRegistro() {
  return `<header class="topo">
      <img src="${ARVORE}" alt="" width="72" height="75">
      <div><p class="selo">SIPAT 2026 · Cultivando o Cuidado</p><h1>Lista de presença</h1></div>
    </header>`;
}

function telaEscolherEvento(ev, pedido) {
  app.innerHTML = `<section class="registro">
    ${cabecalhoRegistro()}
    <div class="cartao">
      ${pedido ? `<p class="aviso erro">Não encontramos esse evento. Escolha abaixo.</p>` : ""}
      <p class="evento-nome">Em qual evento você está?</p>
      <div class="eventos">${ev.lista.map(e => `<button class="botao leve" type="button" data-evento="${esc(e.id)}">${esc(e.nome)}</button>`).join("")}</div>
    </div>
  </section>`;
  app.querySelectorAll("[data-evento]").forEach(b => b.addEventListener("click", () => {
    eventoAtual = ev.lista.find(e => e.id === b.dataset.evento);
    history.replaceState(null, "", linkPresenca(eventoAtual.id));
    telaRegistro();
  }));
}

function telaRegistro(erro, pedirNome) {
  const fechado = !eventoAtual.aberto && !TESTE;
  app.innerHTML = `<section class="registro">
    ${cabecalhoRegistro()}
    <div class="cartao">
      <p class="evento-nome">${esc(eventoAtual.nome)}</p>
      ${fechado ? `<p class="aviso">A lista de presença deste evento já foi encerrada.</p>` : `
      <form id="formPresenca" class="cartao" style="padding:0;border:0;background:none;gap:14px" novalidate>
        <div class="campo">
          <label for="email">Seu e-mail institucional</label>
          <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required placeholder="nome@senarmt.org.br" value="${esc(lembrado("sipat2026-email"))}">
        </div>
        <div class="campo" id="campoNome" ${pedirNome ? "" : "hidden"}>
          <label for="nome">Seu nome completo</label>
          <input id="nome" type="text" autocomplete="name" placeholder="Como está no crachá">
          <p class="nota">Seu e-mail não está na lista da SIPAT, então precisamos do seu nome.</p>
        </div>
        ${erro ? `<p class="aviso erro" role="alert">${esc(erro)}</p>` : ""}
        <button class="botao largo" type="submit" id="btnRegistrar">Registrar presença</button>
        <p class="nota">Aceitamos e-mails ${EVENTOS.dominios.map(d => "@" + esc(d)).join(", ")}. Quem registra a presença participa do sorteio deste evento.</p>
      </form>`}
    </div>
  </section>`;
  if (fechado) return;
  $("formPresenca").addEventListener("submit", ev => { ev.preventDefault(); registrar(); });
  if (pedirNome) $("nome").focus(); else if (!erro) $("email").focus({ preventScroll: true });
}

let enviando = false;
async function registrar() {
  if (enviando) return;
  const email = $("email").value.trim().toLowerCase();
  const nomeEl = $("nome");
  const nome = nomeEl && !$("campoNome").hidden ? nomeEl.value.trim() : "";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return telaRegistro("Confira o e-mail: ele precisa ter o formato nome@dominio.com.br.", !!nome);
  enviando = true;
  const btn = $("btnRegistrar");
  btn.disabled = true; btn.textContent = "Registrando…";
  try {
    const r = await chamar("registrarPresenca", email, nome, eventoAtual.id, TESTE);
    if (r.precisaNome) {
      telaRegistro("", true);
      $("email").value = email;
      return;
    }
    lembrar("sipat2026-email", email);
    telaSucesso(r);
  } catch (e) {
    telaRegistro(e.message, !!nome);
    $("email").value = email;
    if (nome && $("nome")) $("nome").value = nome;
  } finally { enviando = false; }
}

function telaSucesso(r) {
  app.innerHTML = `<section class="registro">
    ${cabecalhoRegistro()}
    <div class="cartao sucesso">
      <div class="selo-ok" aria-hidden="true"><span>✓</span></div>
      <h2>${r.jaRegistrada ? "Você já está na lista" : "Presença registrada"}${r.nome ? `, ${esc(r.nome)}` : ""}!</h2>
      <p class="evento-nome">${esc(r.evento)}</p>
      <p class="nota">${r.jaRegistrada ? "Registro feito às" : "Registrada às"} <span class="hora">${esc(r.quando)}</span>. Você está participando do sorteio deste evento. Boa sorte!</p>
      <button class="link" type="button" id="outro">Registrar outro e-mail</button>
    </div>
  </section>`;
  if (!r.jaRegistrada) chuvaDeFolhas(16);
  $("outro").addEventListener("click", () => { lembrar("sipat2026-email"); telaRegistro(); });
}

/* =========================================================
   TELÃO DO SORTEIO (administrador, no projetor)
   ========================================================= */
let chave = "", painel = null, eventoSorteio = null, atualizador = null, sorteando = false;

function telaChave(erro) {
  document.title = "Sorteio SIPAT 2026";
  app.innerHTML = `<section class="registro">
    ${cabecalhoRegistro().replace("Lista de presença", "Sorteio")}
    <form class="cartao" id="formChave" novalidate>
      <div class="campo"><label for="chave">Chave de administrador</label><input id="chave" type="password" autocomplete="current-password" required></div>
      ${erro ? `<p class="aviso erro" role="alert">${esc(erro)}</p>` : ""}
      <button class="botao largo" type="submit">Abrir telão</button>
      <p class="nota">É a chave definida em ADMIN_CHAVE no Code.gs da lista de presença.</p>
    </form>
  </section>`;
  $("formChave").addEventListener("submit", ev => { ev.preventDefault(); chave = $("chave").value; abrirTelao(); });
  $("chave").focus();
}

async function abrirTelao() {
  app.innerHTML = `<section class="registro">${carregando("Preparando o telão…")}</section>`;
  try {
    const ev = await carregarEventos();
    eventoSorteio = (ev.lista.find(e => e.id === PARAMS.get("evento")) || ev.lista.find(e => e.data === ev.hoje) || ev.lista[0]).id;
    painel = await chamar("painelSorteio", chave, eventoSorteio, TESTE);
    montarTelao();
    clearInterval(atualizador);
    atualizador = setInterval(atualizarContagem, 8000);
  } catch (e) { telaChave(e.message); }
}

function montarTelao() {
  const ev = EVENTOS;
  app.innerHTML = `<section class="telao">
    <div class="cabeca">
      <div><p class="selo">SIPAT 2026 · Cultivando o Cuidado</p><h1 id="tituloEvento">${esc(painel.evento.nome)}</h1></div>
      <div class="controles">
        <div class="campo"><label for="selEvento">Evento</label>
          <select id="selEvento">${ev.lista.map(e => `<option value="${esc(e.id)}" ${e.id === eventoSorteio ? "selected" : ""}>${esc(e.nome)}</option>`).join("")}</select>
        </div>
        <button class="botao leve" type="button" id="btnTelaCheia">Tela cheia</button>
      </div>
    </div>
    <div class="palco-grade">
      <aside class="lateral">
        <div class="qr">
          <p class="selo" style="font-size:1rem">Registre sua presença</p>
          <div id="qrcode" role="img" aria-label="QR Code da lista de presença"></div>
          <p class="url" id="urlPresenca"></p>
        </div>
        <div class="contador" aria-live="polite"><b id="numPresentes">${painel.presentes}</b><span id="txtPresentes">presentes</span></div>
        <ul class="ultimos" id="ultimos"></ul>
        <button class="botao leve" type="button" id="btnLista"></button>
        <div class="baixar" id="baixar"></div>
      </aside>
      <div style="display:grid;gap:20px">
        <div class="palco" id="palco">
          <img class="fundo-arvore" src="${ARVORE}" alt="">
          <p class="rotulo" id="rotulo">Pronto para sortear</p>
          <p class="nome-sorteio" id="nomeSorteio" aria-live="polite">🌳</p>
          <p class="casa-sorteio" id="casaSorteio"></p>
          <div class="barra" aria-hidden="true"><i id="barra"></i></div>
          <div class="opcoes">
            <label><input type="checkbox" id="optCipa" checked> Deixar CIPA e Amigos da CIPA fora</label>
            <label><input type="checkbox" id="optRepetir" checked> Não repetir quem já foi sorteado</label>
          </div>
          <button class="botao sortear" type="button" id="btnSortear">Sortear</button>
          <p class="nota" id="notaSorteio"></p>
        </div>
        <div class="historico"><h3>Sorteados neste evento</h3><ol id="historico"></ol></div>
      </div>
    </div>
  </section>`;
  $("selEvento").addEventListener("change", async e => {
    eventoSorteio = e.target.value;
    painel = await chamar("painelSorteio", chave, eventoSorteio, TESTE);
    history.replaceState(null, "", location.pathname + "?sorteio&evento=" + eventoSorteio + (TESTE ? "&teste" : ""));
    montarTelao();
  });
  $("btnTelaCheia").addEventListener("click", () => {
    const el = document.documentElement;
    Promise.resolve(document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen ? el.requestFullscreen() : null)).catch(() => {});
  });
  $("btnSortear").addEventListener("click", sortearAgora);
  $("btnLista").addEventListener("click", alternarLista);
  desenharQr();
  atualizarPainel();
}

function desenharQr() {
  const url = linkPresenca(eventoSorteio);
  $("urlPresenca").textContent = url.replace(/^https?:\/\//, "");
  const alvo = $("qrcode");
  alvo.innerHTML = "";
  if (window.qrcode) {
    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    alvo.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true, alt: "QR Code da lista de presença" });
  } else {
    alvo.innerHTML = `<p class="nota">Não foi possível gerar o QR Code. Use o link abaixo.</p>`;
  }
}

function atualizarPainel() {
  $("numPresentes").textContent = painel.presentes;
  $("txtPresentes").textContent = painel.presentes === 1 ? "presente" : "presentes";
  $("ultimos").innerHTML = painel.ultimos.map(n => `<li>${esc(n)} chegou</li>`).join("");
  $("btnLista").textContent = painel.aberto ? "Encerrar lista de presença" : "Reabrir lista de presença";
  const elegiveis = painel.presentes - ($("optCipa").checked ? painel.cipa : 0);
  $("notaSorteio").textContent = painel.cipa ? `${painel.cipa} ${painel.cipa === 1 ? "pessoa da CIPA presente" : "pessoas da CIPA presentes"}. Concorrendo agora: cerca de ${Math.max(0, elegiveis - ($("optRepetir").checked ? painel.sorteados.length : 0))}.` : "";
  $("historico").innerHTML = painel.sorteados.length
    ? painel.sorteados.map(x => `<li><span class="n">${x.n}º</span><span><strong>${esc(x.nome)}</strong>${x.casa ? ` · ${esc(x.casa)}` : ""}</span><span class="q">${esc(x.quando)}</span></li>`).join("")
    : `<li style="justify-content:center;color:var(--tinta-suave)">Ninguém sorteado ainda.</li>`;
  const d = painel.downloads || {};
  $("baixar").innerHTML = `
    <a href="${esc(d.presencas)}" target="_blank" rel="noopener">Baixar presenças (.csv)</a>
    <a href="${esc(d.sorteios)}" target="_blank" rel="noopener">Baixar sorteios (.csv)</a>
    <a href="${esc(d.planilha)}" target="_blank" rel="noopener">Abrir a planilha</a>
    ${TESTE ? `<button class="link" type="button" id="btnLimparTeste" style="justify-self:start">Apagar dados de teste</button>` : ""}`;
  if (TESTE) $("btnLimparTeste").addEventListener("click", limparTeste);
}

let confirmarLimpeza = false;
async function limparTeste() {
  const b = $("btnLimparTeste");
  if (!confirmarLimpeza) { confirmarLimpeza = true; b.textContent = "Toque de novo para apagar"; setTimeout(() => { confirmarLimpeza = false; if ($("btnLimparTeste")) $("btnLimparTeste").textContent = "Apagar dados de teste"; }, 4000); return; }
  confirmarLimpeza = false;
  try { await chamar("limparTestes", chave); painel = await chamar("painelSorteio", chave, eventoSorteio, TESTE); atualizarPainel(); }
  catch (e) { $("notaSorteio").textContent = e.message; }
}

async function atualizarContagem() {
  if (sorteando || !chave) return;
  try { painel = await chamarUmaVez("painelSorteio", [chave, eventoSorteio, TESTE]); atualizarPainel(); } catch (e) {}
}

async function alternarLista() {
  const abrir = !painel.aberto;
  $("btnLista").disabled = true;
  try { await chamar("alternarPresenca", chave, eventoSorteio, abrir); painel.aberto = abrir; EVENTOS = null; await carregarEventos(); atualizarPainel(); }
  catch (e) { $("notaSorteio").textContent = e.message; }
  finally { $("btnLista").disabled = false; }
}

async function sortearAgora() {
  if (sorteando) return;
  sorteando = true;
  const btn = $("btnSortear"), nome = $("nomeSorteio"), casa = $("casaSorteio"), rotulo = $("rotulo"), barra = $("barra");
  btn.disabled = true;
  casa.textContent = "";
  nome.className = "nome-sorteio girando";
  rotulo.textContent = "Sorteando…";
  barra.style.transition = "none"; barra.style.width = "0";

  // efeito começa enquanto o servidor sorteia
  let amostra = painel.ultimos.length ? painel.ultimos.slice() : ["🌱", "🌿", "🍃", "🌳"];
  let rodando = true, k = 0;
  const girarRapido = () => { if (!rodando) return; nome.textContent = amostra[k++ % amostra.length]; setTimeout(girarRapido, 60); };
  girarRapido();

  try {
    const r = await chamar("sortear", chave, eventoSorteio, { excluirCipa: $("optCipa").checked, excluirSorteados: $("optRepetir").checked }, TESTE);
    amostra = r.amostra.length ? r.amostra : [r.vencedor.nome];
    rodando = false;
    rotulo.textContent = `Sorteio nº ${r.n} · ${r.concorrentes} ${r.concorrentes === 1 ? "pessoa concorrendo" : "pessoas concorrendo"}`;
    await desacelerar(amostra, r.vencedor.nome, nome, barra);
    nome.textContent = r.vencedor.nome;
    nome.className = "nome-sorteio vencedor";
    casa.textContent = r.vencedor.casa ? r.vencedor.casa : "";
    chuvaDeFolhas(60);
    painel = await chamar("painelSorteio", chave, eventoSorteio, TESTE);
    atualizarPainel();
  } catch (e) {
    rodando = false;
    nome.className = "nome-sorteio";
    nome.textContent = "🌳";
    rotulo.textContent = e.message;
  } finally {
    sorteando = false;
    btn.disabled = false;
    btn.textContent = "Sortear de novo";
  }
}

// passa pelos nomes cada vez mais devagar (cerca de 6 s) e para no vencedor
function desacelerar(nomes, vencedor, el, barra) {
  if (REDUZIR) return Promise.resolve();
  const passos = 38;
  return new Promise(ok => {
    barra.style.transition = "width 6s cubic-bezier(.2,.6,.3,1)";
    requestAnimationFrame(() => { barra.style.width = "100%"; });
    let i = 0;
    const passo = () => {
      if (i >= passos) return ok();
      el.textContent = i === passos - 1 ? vencedor : nomes[(Math.random() * nomes.length) | 0];
      const t = i / passos;
      i++;
      setTimeout(passo, 45 + Math.pow(t, 3) * 520);
    };
    passo();
  });
}

/* ---------- Início ---------- */
if (TESTE) $("faixaTeste").hidden = false;
if (MODO === "sorteio") telaChave(); else iniciarRegistro();
</script>
